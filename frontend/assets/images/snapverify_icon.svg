<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b894" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00b894" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00b894" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Outer scan frame -->
  <rect x="72" y="72" width="368" height="368" rx="24" fill="none" stroke="#00b894" stroke-width="4" opacity="0.6"/>

  <!-- Inner scan frame -->
  <rect x="104" y="104" width="304" height="304" rx="16" fill="none" stroke="#00cec9" stroke-width="2" opacity="0.4"/>

  <!-- Camera aperture rings -->
  <circle cx="256" cy="230" r="60" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="256" cy="230" r="40" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
  <circle cx="256" cy="230" r="20" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>

  <!-- Camera aperture blades -->
  <path d="M256 170 L270 210 L310 210 L275 235 L290 275 L256 250 L222 275 L237 235 L202 210 L242 210 Z" fill="url(#accent)" opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="256" cy="230" r="6" fill="#1a1a2e"/>

  <!-- Scan line -->
  <rect x="130" y="310" width="252" height="3" rx="1.5" fill="url(#scan)"/>

  <!-- Checkmark -->
  <path d="M230 340 L248 358 L282 324" stroke="#00b894" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>